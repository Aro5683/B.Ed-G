<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.Ed Lesson Planner & Hex Engine</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --accent-primary: #10a37f; /* ChatGPT Emerald */
            --accent-primary-hover: #0e8e6d;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .main-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .tab-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .tab-btn {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--accent-primary);
            color: #ffffff;
            border-color: var(--accent-primary);
            box-shadow: 0 4px 14px rgba(16, 163, 127, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input, select, textarea {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder, textarea::placeholder {
            color: #94a3b8;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.15);
        }

        .action-btn {
            background: var(--accent-primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--accent-primary-hover);
            transform: translateY(-1px);
        }

        .upload-dropzone {
            border: 2px dashed #cbd5e1;
            background: #f8fafc;
            border-radius: 16px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .upload-dropzone:hover {
            background: #f1f5f9;
            border-color: var(--accent-primary);
        }

        .presentation-wrapper {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
            margin-top: 35px;
        }

        .landscape-page {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #ffffff;
            color: #0f172a;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px 50px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .page-header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header h2 {
            font-size: 1.3rem;
            color: #0f172a;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .page-tag {
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #475569;
            border: 1px solid #cbd5e1;
        }

        .page-body {
            flex: 1;
            margin: 20px 0;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #334155;
            overflow-y: auto;
        }

        .page-body.page-1-center {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
        }

        .page-1-center h1 {
            font-size: 2rem;
            color: #0f172a;
            margin-bottom: 25px;
            font-weight: 800;
            text-transform: uppercase;
            border-bottom: 3px solid var(--accent-primary);
            padding-bottom: 6px;
        }

        .meta-container-centered {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 650px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 24px 30px;
            border-radius: 14px;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 8px;
        }

        .meta-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .meta-row strong {
            color: #0f172a;
            font-weight: 700;
        }

        /* Sub-Topic Styling */
        .subtopic-block {
            margin-bottom: 16px;
        }

        .subtopic-title {
            font-size: 1rem;
            font-weight: 800;
            color: #0f172a;
            margin-top: 10px;
            margin-bottom: 6px;
            display: block;
        }

        .subtopic-list {
            margin-left: 20px;
            margin-bottom: 10px;
            padding-left: 0;
            list-style-type: disc;
        }

        .subtopic-list li {
            font-size: 0.92rem;
            color: #334155;
            margin-bottom: 4px;
            line-height: 1.5;
        }

        .dialogue-box {
            background: #f8fafc;
            border-left: 4px solid var(--accent-primary);
            padding: 14px 18px;
            border-radius: 8px;
            margin: 10px 0;
            line-height: 1.7;
        }

        .lp-table {
            width: 100%;
            border-collapse: collapse;
            height: 100%;
            table-layout: fixed;
        }

        .lp-table th, .lp-table td {
            border: 1px solid #cbd5e1;
            padding: 10px 12px;
            vertical-align: top;
            font-size: 0.88rem;
            word-wrap: break-word;
        }

        .lp-table th {
            background: #f1f5f9;
            color: #0f172a;
            font-weight: 800;
            text-align: left;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .lp-table td:nth-child(1) { width: 20%; background: #f8fafc; font-weight: 700; color: #0f172a; }
        .lp-table td:nth-child(2) { width: 16%; background: #ffffff; color: var(--accent-primary); font-weight: 700; }
        .lp-table td:nth-child(3) { width: 44%; background: #ffffff; }
        .lp-table td:nth-child(4) { width: 20%; background: #f8fafc; color: #0f172a; font-weight: 600; }

        .signature-footer {
            display: flex;
            justify-content: space-between;
            padding-top: 14px;
            border-top: 2px dashed #cbd5e1;
            font-weight: 800;
            font-size: 0.88rem;
            color: #0f172a;
            margin-top: 10px;
        }

        /* POPUP CSS MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        .modal-icon {
            width: 60px;
            height: 60px;
            background: #ecfdf5;
            border: 2px solid var(--accent-primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 16px;
            font-size: 1.5rem;
            color: var(--accent-primary);
        }

        .modal-card h3 {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .modal-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .chatgpt-btn {
            background: var(--accent-primary);
            color: #ffffff;
            font-weight: 700;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .chatgpt-btn:hover {
            background: var(--accent-primary-hover);
        }

        .close-modal-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
        }

        .close-modal-btn:hover {
            color: var(--text-main);
        }

        .hidden { display: none !important; }

        @media (max-width: 900px) {
            .landscape-page {
                aspect-ratio: auto;
                min-height: 550px;
                padding: 24px 18px;
            }
            .main-container { padding: 24px 16px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <h1><i class="fa-solid fa-graduation-cap"></i> B.Ed Lesson Planner</h1>
        <p>Enforced Machine Prompting & 16:9 Presentation Renderer</p>
    </div>

    <!-- Navigation Tabs -->
    <div class="tab-nav">
        <button class="tab-btn active" id="tab1-btn" onclick="switchTab('tab1')">
            <i class="fa-solid fa-pen-to-square"></i> Step 1        </button>
        <button class="tab-btn" id="tab2-btn" onclick="switchTab('tab2')">
            <i class="fa-solid fa-file-arrow-up"></i> Step 2
        </button>
    </div>

    <!-- TAB 1: FORM & HEX ENFORCED PROMPT GENERATOR -->
    <div id="tab1-content">
        <form id="lpForm" onsubmit="generateHexPrompt(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> Student Teacher Name *</label>
                    <input type="text" id="studentName" placeholder="e.g., KAMALIGA . J" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-user-tie"></i> Guide Teacher Name *</label>
                    <input type="text" id="guideName" placeholder="e.g., Mrs. K. KALA, M.Sc., B.Ed." required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-school"></i> School Name *</label>
                    <input type="text" id="schoolName" placeholder="e.g., Govt. Hr. Sec. School" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-layer-group"></i> Standard / Class *</label>
                    <input type="text" id="standard" placeholder="e.g., 8th std" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-book"></i> Subject *</label>
                    <input type="text" id="subject" placeholder="e.g., Mathematics" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-lightbulb"></i> Topic Name *</label>
                    <input type="text" id="topic" placeholder="e.g., Life Mathematics - Profit & Loss" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-clock"></i> Duration</label>
                    <input type="text" value="45 minutes" disabled>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-calendar-day"></i> Date *</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group full-width">
                    <label><i class="fa-solid fa-toolbox"></i> Teaching Aids *</label>
                    <input type="text" id="teachingAids" placeholder="e.g., Chart, Flashcards, Blackboard, Chalk" required>
                </div>
                <div class="form-group full-width">
                    <label><i class="fa-solid fa-list-check"></i> Content Ideas / Key Points *</label>
                    <textarea id="contentIdeas" rows="3" placeholder="Enter key topics to cover in tables..." required></textarea>
                </div>
            </div>

            <button type="submit" class="action-btn">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generate
            </button>
        </form>
    </div>

    <!-- TAB 2: HEX DECODER & PRESENTATION VIEWER -->
    <div id="tab2-content" class="hidden">
        <div class="upload-dropzone" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size: 2.2rem; color: var(--accent-primary); margin-bottom: 10px;"></i>
            <h3>Upload ChatGPT (.txt file)</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Or drag & drop the saved text file here</p>
            <input type="file" id="fileInput" accept=".txt" class="hidden" onchange="handleFileUpload(event)">
        </div>

        <div class="form-group">
          
            
          
        </div>

        <div id="presentationArea" class="presentation-wrapper hidden">
            <!-- Rendered Pages will appear here -->
        </div>
    </div>
</div>

<!-- SUCCESS MODAL FOR CHATGPT -->
<div class="modal-overlay" id="successModal">
    <div class="modal-card">
        <button class="close-modal-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        <div class="modal-icon">
            <i class="fa-solid fa-check"></i>
        </div>
        <h3>Prompt Generated!</h3>
        <p>Click below to launch <strong>ChatGPT</strong> directly with your prompt prefilled in the chat box.</p>
        <button class="chatgpt-btn" onclick="openChatGPTWithPrompt()">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Launch ChatGPT with Prefilled Prompt
        </button>
    </div>
</div>

<script>
    let generatedHexPromptString = '';

    function switchTab(tabId) {
        if(tabId === 'tab1') {
            document.getElementById('tab1-content').classList.remove('hidden');
            document.getElementById('tab2-content').classList.add('hidden');
            document.getElementById('tab1-btn').classList.add('active');
            document.getElementById('tab2-btn').classList.remove('active');
        } else {
            document.getElementById('tab2-content').classList.remove('hidden');
            document.getElementById('tab1-content').classList.add('hidden');
            document.getElementById('tab2-btn').classList.add('active');
            document.getElementById('tab1-btn').classList.remove('active');
        }
    }

function stringToHex(str) {
    const encoder = new TextEncoder();
    const bytes = encoder.encode(str);
    return Array.from(bytes)
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
}

    function generateHexPrompt(e) {
        e.preventDefault();
        const studentName = document.getElementById('studentName').value;
        const guideName = document.getElementById('guideName').value;
        const schoolName = document.getElementById('schoolName').value;
        const standard = document.getElementById('standard').value;
        const subject = document.getElementById('subject').value;
        const topic = document.getElementById('topic').value;
        const date = document.getElementById('date').value;
        const teachingAids = document.getElementById('teachingAids').value;
        const contentIdeas = document.getElementById('contentIdeas').value;

        const rawPrompt = `Act as an expert B.Ed Teacher Educator. Generate a concise 7-page Lesson Plan for ${standard} ${subject} on the topic "${topic}" formatted strictly for a B.Ed practical record notebook.

STRICT 4-COLUMN LAYOUT RULES FOR PAGES 04, 05, AND 06:
Every single row in Pages 04, 05, and 06 MUST contain EXACTLY FOUR pipe-separated parts:
CONTENT | SPECIFICATION | LEARNING EXPERIENCE | EVALUATION

Do NOT skip any column!
- CONTENT: Subheading or Topic Name (e.g., "Example 1 (Profit)")
- SPECIFICATION: Single action verb (e.g., "Solves", "Explains", "Defines")
- LEARNING EXPERIENCE: Full explanation, step-by-step teacher working, and calculations.
- EVALUATION: Evaluation check question for students (e.g., "Find Profit % if CP = Rs. 200 and SP = Rs. 250").

Format page-by-page strictly using headers "PAGE 01:", "PAGE 02:", etc.:

PAGE 01: General Information
Name of the Student Teacher: ${studentName}
Name of the Guide Teacher: ${guideName}
Name of the School: ${schoolName}
Class: ${standard}
Subject: ${subject}
Topic: ${topic}
Duration: 45 minutes
Date: ${date}

PAGE 02: 
Instructional Objectives:
- Objective 1 starting with an action verb.
- Objective 2 starting with an action verb.
- Objective 3 starting with an action verb.

Teaching Aids:
- ${teachingAids}

Previous Knowledge:
- Previous Knowledge of Learners: Students already have basic knowledge about ${topic}. Followed by 3 quick teacher entry questions.

PAGE 03: Motivation 
- A brief 5-6 line dialogue exchange between Teacher and Student leading to the topic.

PAGES 04, 05 & 06: 4-Column Table
Format strictly: Content | Specification | Learning Experience | Evaluation
Using Content Ideas: "${contentIdeas}"
- PAGE 04: Key definitions & basic concepts.
- PAGE 05: Core rules, formulas, or procedures.
- PAGE 06: Solved sample problems / step-by-step examples.

PAGE 07: 
Summarises:
- 1-2 summary lines.

Follow up:
- 2-3 homework questions.

OUTPUT INSTRUCTIONS:
1. Do NOT generate any PDF document or PYTHON.
2. Convert the entire generated text strictly into Hexadecimal string data.
3. Output ONLY a single downloadable .txt file containing the raw hex code string.`;

        generatedHexPromptString = stringToHex(rawPrompt);
        
        // Also copy to clipboard as a safety backup
        navigator.clipboard.writeText(generatedHexPromptString).catch(err => {
            console.warn('Clipboard write deferred to button click.');
        });

        document.getElementById('successModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('successModal').classList.remove('active');
    }

    function openChatGPTWithPrompt() {
        if (generatedHexPromptString) {
            // Encode the Hex prompt into the URL parameter so ChatGPT pre-loads it automatically
            const targetUrl = `https://chatgpt.com/?q=${encodeURIComponent(generatedHexPromptString)}`;
            window.open(targetUrl, '_blank');
            closeModal();
        }
    }

// Correctly decodes Hex back to UTF-8 without garbled characters (â≡≡)
function hexToString(hex) {
    // 1. Strip out markdown code fences (```) and non-hex characters
    hex = hex.replace(/```[a-z]*|```/gi, '').replace(/[^0-9a-fA-F]/g, '');
    
    // 2. Convert hex string into Uint8Array byte array
    const bytes = new Uint8Array(hex.match(/.{1,2}/g)?.map(byte => parseInt(byte, 16)) || []);
    
    // 3. Decode bytes using UTF-8 TextDecoder
    const decoder = new TextDecoder('utf-8');
    return decoder.decode(bytes);
}
    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            renderLessonPlanPages(hexToString(evt.target.result));
        };
        reader.readAsText(file);
    }

    function decodeManualHex() {
        const hex = document.getElementById('manualHexInput').value;
        if (!hex) return alert('Please paste output text first!');
        renderLessonPlanPages(hexToString(hex));
    }

    function renderLessonPlanPages(decodedText) {
        const container = document.getElementById('presentationArea');
        container.innerHTML = '';
        container.classList.remove('hidden');

        let pagesRaw = decodedText.split(/PAGE\s+0[1-7]:?/i).filter(p => p.trim().length > 0);
        if (pagesRaw.length === 0) pagesRaw = [decodedText];

        pagesRaw.forEach((pageContent, idx) => {
            const pageNum = idx + 1;
            const pageDiv = document.createElement('div');
            pageDiv.className = 'landscape-page';

            let bodyContent = '';
            let isPageOne = (pageNum === 1);

            if (pageNum >= 4 && pageNum <= 6) {
                bodyContent = renderTablePage(pageContent);
            } else if (isPageOne) {
                bodyContent = renderCenteredMetadataPage(pageContent);
            } else {
                bodyContent = formatStructuredSections(pageContent);
            }

            let html = `
                <div class="page-header">
                    <h2>PAGE 0${pageNum}</h2>
                    <span class="page-tag"><i class="fa-solid fa-book-open"></i> B.Ed Lesson Plan</span>
                </div>
                <div class="page-body ${isPageOne ? 'page-1-center' : ''}">
                    ${bodyContent}
                </div>
            `;

            if (pageNum === 7 || idx === pagesRaw.length - 1) {
                html += `
                    <div class="signature-footer">
                        <span><i class="fa-solid fa-pen-fancy"></i> Signature of Student Teacher</span>
                        <span><i class="fa-solid fa-pen-nib"></i> Signature of Guide Teacher</span>
                    </div>
                `;
            }

            pageDiv.innerHTML = html;
            container.appendChild(pageDiv);
        });
    }

    function renderCenteredMetadataPage(text) {
        const lines = text.split('\n').filter(l => l.trim().length > 0);
        let itemsHtml = '';
        
        lines.forEach(line => {
            if(line.includes(':')) {
                const parts = line.split(':');
                const key = parts[0].replace(/^[-*]\s*/, '').trim();
                const val = parts.slice(1).join(':').trim();
                itemsHtml += `
                    <div class="meta-row">
                        <span><strong>${key}</strong></span>
                        <span>${val}</span>
                    </div>`;
            }
        });

        return `
            <h1>LESSON PLAN</h1>
            <div class="meta-container-centered">
                ${itemsHtml}
            </div>
        `;
    }

    function formatStructuredSections(text) {
        const lines = text.split('\n').filter(l => l.trim().length > 0);
        let html = '';
        let inList = false;

        lines.forEach(line => {
            let trimmed = line.trim();
            
            if (trimmed.match(/^(Instructional Objectives|Teaching Aids|Previous Knowledge|Motivation|Summaries|Summarises|Follow-up|Follow up):?/i)) {
                if (inList) { html += '</ul></div>'; inList = false; }
                const title = trimmed.replace(':', '');
                html += `<div class="subtopic-block"><strong class="subtopic-title">${title}:</strong>`;
            } 
            else if (trimmed.startsWith('-') || trimmed.startsWith('*') || /^\d+\./.test(trimmed)) {
                if (!inList) { html += '<ul class="subtopic-list">'; inList = true; }
                const cleanPoint = trimmed.replace(/^[-*\d.]+\s*/, '');
                html += `<li>${parseMarkdown(cleanPoint)}</li>`;
            } 
            else {
                if (inList) { html += '</ul></div>'; inList = false; }
                if (trimmed.startsWith('Teacher:') || trimmed.startsWith('Student:')) {
                    html += `<div class="dialogue-box"><strong>${trimmed.split(':')[0]}:</strong> ${trimmed.split(':').slice(1).join(':')}</div>`;
                } else {
                    html += `<p style="margin-bottom: 8px;">${parseMarkdown(trimmed)}</p>`;
                }
            }
        });

        if (inList) html += '</ul></div>';
        return html;
    }

    function renderTablePage(text) {
        const lines = text.split('\n').filter(l => l.trim().length > 0);
        let tableRows = '';

        lines.forEach((line, index) => {
            if (line.includes('|')) {
                let cols = line.split('|').map(c => parseMarkdown(c.trim()));

                if (cols.some(c => c.toLowerCase() === 'content' || c.toLowerCase() === 'specification')) return;
                if (cols.length > 0 && cols[0] === '') cols.shift();

                let content = '', spec = '', exp = '', evalCol = '';

                if (cols.length >= 4) {
                    content = cols[0]; spec = cols[1]; exp = cols[2]; evalCol = cols[3];
                } else if (cols.length === 3) {
                    content = cols[0]; spec = cols[1]; exp = cols[2];
                    evalCol = content.toLowerCase().includes('profit') ? "Find Profit % if CP = Rs. 300, SP = Rs. 360." : `Solve a practical question on ${content}.`;
                } else if (cols.length === 2) {
                    content = cols[0]; spec = "Explains / Solves"; exp = cols[1]; evalCol = "Assess student understanding.";
                }

                if (content || exp) {
                    tableRows += `<tr>
                        <td>${content || `Topic ${index + 1}`}</td>
                        <td>${spec || 'Solves'}</td>
                        <td>${exp}</td>
                        <td>${evalCol}</td>
                    </tr>`;
                }
            }
        });

        return `
            <table class="lp-table">
                <thead>
                    <tr>
                        <th>CONTENT</th>
                        <th>SPECIFICATION</th>
                        <th>LEARNING EXPERIENCE</th>
                        <th>EVALUATION</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                </tbody>
            </table>
        `;
    }

    function parseMarkdown(text) {
        return text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>');
    }
</script>
